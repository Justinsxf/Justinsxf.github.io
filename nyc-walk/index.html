<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>A Walk Through New York</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* Layout: the pixel stage fills the window like a game screen; HUD buttons live inside it, stops sit in one slim row below */
:root{
  --bg:#0c0d11; --panel:#16171d; --line:#2a2c35; --ink:#f1eee6; --dim:#8e909c; --taxi:#f5c518; --chip:#fbfaf5;
  --pix:"Silkscreen",ui-monospace,Menlo,monospace;
  --sign:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sign);margin:0}
.wrap{width:min(100%,calc((100vh - 64px) * 16 / 9 + 32px));max-width:1640px;margin:0 auto;padding-block:10px 12px;padding-inline:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.sign{position:absolute;left:1.4%;top:2.4%;background:#0b0b0b;color:#fff;border-radius:3px;padding:4px 8px 5px;display:flex;flex-direction:column;gap:2px;pointer-events:none;max-width:46%}
.sign::before{content:"";display:block;height:1px;background:#fff;opacity:.85;margin-bottom:2px}
.sign .name{font-weight:700;font-size:clamp(10px,1.35vw,15px);line-height:1.1;white-space:nowrap}
.sign .sub{font-size:clamp(8px,.9vw,10px);opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bullets{display:flex;gap:2px;flex-wrap:wrap}
.b{width:clamp(12px,1.5vw,16px);height:clamp(12px,1.5vw,16px);border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:clamp(8px,1vw,10px);color:#fff;line-height:1}
.b.dk{color:#111}
.hud{position:absolute;right:1.4%;top:2.4%;display:flex;gap:4px}
.hud button{font-family:var(--pix);font-size:clamp(8px,.95vw,11px);letter-spacing:.02em;padding:3px 7px;background:var(--chip);color:#111;border:1px solid #111;border-radius:2px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.hud button[aria-pressed="true"]{background:#111;color:var(--chip);border-color:var(--chip)}
.arrive{position:absolute;left:50%;top:2.4%;transform:translateX(-50%) translateY(-6px);pointer-events:none;opacity:0;transition:opacity .35s,transform .35s;background:#0b0b0b;color:#fff;border-radius:3px;padding:5px 12px 6px;display:flex;align-items:center;gap:8px;border-top:2px solid #fff;white-space:nowrap}
.arrive.on{opacity:1;transform:translateX(-50%)}
.arrive .kick{font-family:var(--pix);font-size:clamp(7px,.8vw,9px);letter-spacing:.1em;color:var(--taxi)}
.arrive .name{font-weight:700;font-size:clamp(11px,1.5vw,16px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:6px 14px;flex-wrap:wrap}
.stops{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.stop{font-family:var(--sign);font-weight:700;font-size:11px;display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer}
.stop .b{width:15px;height:15px;font-size:9px}
.stop[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stop:hover{color:var(--ink)}
.stop[aria-pressed="true"]:hover{color:var(--bg)}
.hint{font-family:var(--pix);font-size:9px;color:var(--dim);letter-spacing:.03em}
button:focus-visible{outline:2px solid var(--taxi);outline-offset:2px}
@media (hover:none){.hint .k{display:none}}
@media (max-width:560px){.sign .sub{display:none}.hint{display:none}}
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Pixel art walk through New York City"></canvas>
    <div class="sign" id="sign"><div class="bullets" id="signB"></div><div class="name" id="signN"></div><div class="sub" id="signS"></div></div>
    <div class="arrive" id="arrive"><span class="kick">NOW ARRIVING</span><span class="bullets" id="arrB"></span><span class="name" id="arrN"></span></div>
    <div class="hud">
      <button id="btnTime" title="Time of day (T)">Night</button>
      <button id="btnW" title="Weather (R)">Clear</button>
      <button id="btnStroll" aria-pressed="true" title="Auto walk (Space)">Stroll</button>
      <button id="btnMusic" aria-pressed="false" title="8-bit music">♪</button>
    </div>
  </div>
  <div class="bar">
    <div class="stops" id="stops"></div>
    <div class="hint"><span class="k">← → walk · 1–6 jump · T time · R weather · Space stroll · </span>hold the left or right side of the scene to walk</div>
  </div>
  <audio id="bgm" loop preload="none"></audio><style>#btnMusic{display:none}</style>
</div>

<script>
(()=>{
const W=400,H=225,G=168,CURB=188,FEET=183,PX=178,L=1500,SPEED=56,FB=172;
const FAR_LANE=205,NEAR_LANE=222;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
cv.width=W*2;cv.height=H*2;ctx.imageSmoothingEnabled=false;

const S={scene:0,time:'sunset',weather:'clear',timeLocked:false,cam:30,dir:1,moving:false,stroll:true,l:false,r:false,t:0,dist:0,boat:0,trans:null,bob:0};

/* ---------- utils ---------- */
const mod=(a,n)=>((a%n)+n)%n;
const clamp=v=>v<0?0:v>255?255:v|0;
function hash(n){n=n|0;n=Math.imul(n^(n>>>16),0x45d9f3b);n=Math.imul(n^(n>>>16),0x45d9f3b);n^=n>>>16;return(n>>>0)/4294967296}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pick=(arr,R)=>arr[Math.floor(R()*arr.length)];
function hx(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function shade(h,f){return'#'+hx(h).map(v=>clamp(v*f).toString(16).padStart(2,'0')).join('')}

/* ---------- light & tint ---------- */
const TINTS={day:{m:[1,1,1],a:[0,0,0]},sunset:{m:[1.0,.8,.74],a:[16,0,20]},night:{m:[.25,.28,.46],a:[6,8,24]}};
let TK='',cKey='',cMap=new Map();
function C(h,k=1){if(TK!==cKey){cKey=TK;cMap.clear()}const key=k===1?h:h+k;let v=cMap.get(key);if(v)return v;let[a,b,c]=hx(h);const m0=TINTS[S.time],m={m:m0.m.map(x=>1-(1-x)*k),a:m0.a.map(x=>x*k)};
  if(S.weather==='rain'){const l=(a+b+c)/3;a=(a*.72+l*.28)*.82;b=(b*.72+l*.28)*.85;c=(c*.72+l*.28)*.93}
  else if(S.weather==='snow'){const l=(a+b+c)/3;a=(a*.86+l*.14)*.98;b=b*.86+l*.14;c=(c*.86+l*.14)*1.05}
  a=a*m.m[0]+m.a[0];b=b*m.m[1]+m.a[1];c=c*m.m[2]+m.a[2];v=`rgb(${clamp(a)},${clamp(b)},${clamp(c)})`;cMap.set(key,v);return v}
function LV(){return({day:0,sunset:.5,night:1})[S.time]+(S.weather==='rain'&&S.time==='day'?.12:0)}

/* ---------- primitives ---------- */
function r(x,y,w,h,c){ctx.fillStyle=C(c);ctx.fillRect(Math.floor(x),Math.floor(y),Math.round(w),Math.round(h))}
function e(x,y,w,h,c,a=1){if(a<=0)return;ctx.globalAlpha=Math.min(1,a);ctx.fillStyle=c;ctx.fillRect(Math.floor(x),Math.floor(y),Math.round(w),Math.round(h));ctx.globalAlpha=1}
function circ(cx,cy,rad,c,raw=false,a=1){rad=Math.round(rad);if(rad<1){(raw?e:r)(cx,cy,1,1,c,a);return}ctx.globalAlpha=a;ctx.fillStyle=raw?c:C(c);for(let dy=-rad;dy<=rad;dy++){const hw=Math.floor(Math.sqrt(rad*rad-dy*dy+rad*.6));ctx.fillRect(Math.floor(cx-hw),Math.floor(cy+dy),hw*2+1,1)}ctx.globalAlpha=1}
function glow(cx,cy,rad,c,a){if(a<=0)return;for(let i=3;i>=1;i--)circ(cx,cy,rad*i/3,c,true,a*.16)}
function line(x0,y0,x1,y1,c){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))|0;for(let i=0;i<=n;i++)r(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n,1,1,c)}
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'1000111011101011000110001',N:'10011101101110011001',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'1000110001101011101110001',X:'101101010101101',Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110','$':'011110010011110','!':'010010010000010','.':'000000000000010','-':'000000111000000','&':'010101010101011','<':'101111111010000',"'":'010010000000000',':':'000010000010000','/':'001001010100100','*':'000101010101000',' ':'000000000000000'};
function txt(s,x,y,c,sc=1,raw=false,a=1){ctx.globalAlpha=a;ctx.fillStyle=raw?c:C(c);let cx=Math.floor(x);const y0=Math.floor(y);for(const ch of s){const f=FONT[ch]||FONT[' '],gw=f.length/5;for(let i=0;i<f.length;i++)if(f[i]==='1')ctx.fillRect(cx+(i%gw)*sc,y0+Math.floor(i/gw)*sc,sc,sc);cx+=(gw+1)*sc}ctx.globalAlpha=1}
const tw=(s,sc=1)=>{let w=0;for(const ch of s)w+=((FONT[ch]||FONT[' ']).length/5+1)*sc;return w-sc};
function drawSprite(rows,pal,x,y,sc,flip){const w=rows[0].length;x=Math.floor(x);y=Math.floor(y);for(let j=0;j<rows.length;j++){const row=rows[j];for(let i=0;i<w;i++){const ch=row[i];if(ch==='.')continue;const col=pal[ch];if(!col)continue;ctx.fillStyle=C(col);ctx.fillRect(x+(flip?w-1-i:i)*sc,y+j*sc,sc,sc)}}}

/* ---------- sky ---------- */
const SKIES={clear:{day:['#4f9fdc','#8cc8ee','#cfeaf6'],sunset:['#2b2758','#7a4a88','#e2766a','#f7c27e'],night:['#060a20','#111a42','#2a2d5a']},
 rain:{day:['#6f7a88','#9aa3ae','#bfc5cc'],sunset:['#34324a','#6a5468','#a8807a'],night:['#07090f','#121624','#20263a']},
 snow:{day:['#9aa8b8','#c9d2dc','#e8ecf0'],sunset:['#4a4766','#8c7790','#d9ab9c'],night:['#0e1328','#1d2440','#363c58']}};
function sampleStops(st,t){const n=st.length-1;const f=Math.min(n-1e-6,Math.max(0,t*n));const i=f|0,u=f-i;const a=hx(st[i]),b=hx(st[i+1]);return`rgb(${clamp(a[0]+(b[0]-a[0])*u)},${clamp(a[1]+(b[1]-a[1])*u)},${clamp(a[2]+(b[2]-a[2])*u)})`}
const STARS=[...Array(70)].map((_,i)=>[hash(i*3+1)*W|0,hash(i*7+2)*110|0,hash(i*11+5)*6]);
const CLOUDS=[...Array(9)].map((_,i)=>({x:hash(i*13+1)*560,y:12+hash(i*7+3)*62|0,w:22+hash(i*5+2)*42|0,s:1.5+hash(i)*3}));
function drawSky(){const st=SKIES[S.weather][S.time];
  for(let y=0;y<G;y+=3){ctx.fillStyle=sampleStops(st,Math.round(y/150*12)/12);ctx.fillRect(0,y,W,3)}
  if(S.weather==='clear'){
    if(S.time==='day'){circ(334,32,11,'#fff6c8',true,.35);circ(334,32,8,'#fff8d8',true)}
    else if(S.time==='sunset'){const cx=292,cy=112,rad=20;ctx.fillStyle='#ffcf76';for(let dy=-rad;dy<=rad;dy++){if(dy>3&&dy%4===0)continue;const hw=Math.floor(Math.sqrt(rad*rad-dy*dy));ctx.fillRect(cx-hw,cy+dy,hw*2+1,1)}glow(cx,cy,40,'#ffb070',.5)}
    else{for(const[x,y,p]of STARS){e(x,y,1,1,'#ffffff',.35+.65*Math.abs(Math.sin(S.t*1.1+p)))}circ(332,30,8,'#f3efd8',true);circ(336,27,7,sampleStops(st,Math.round(27/150*12)/12),true);glow(332,30,26,'#cfd8ff',.35)}
  }
  const n=S.weather==='clear'?5:9,col=S.weather==='clear'?'#ffffff':'#bcc3cc';
  for(let i=0;i<n;i++){const c=CLOUDS[i];const x=mod(c.x-S.t*c.s-S.cam*.03,560)-80,y=c.y;r(x,y,c.w,4,col);r(x+4,y-3,c.w*.55,3,col);r(x+c.w*.3,y-6,c.w*.3,3,col);r(x+2,y+4,c.w-4,1,shade(col,.86))}
}

/* ---------- shared scenery ---------- */
function win(x,y,w,h,seed,glass){const lv=LV(),hh=hash(seed);if(lv>0&&hh<lv*.55)e(x,y,w,h,hh<lv*.1?'#cfe8ff':'#ffd98a',.95);else{r(x,y,w,h,glass);r(x,y,1,Math.max(1,h>>1),'#b9d3e3')}}
function genSky(seed,x0,x1,base,hmin,hmax,cols,wc){const R=rng(seed),a=[];let x=x0;while(x<x1){const w=7+Math.floor(R()*14);a.push({x,w,h:hmin+Math.floor(R()*(hmax-hmin)),base,c:cols[Math.floor(R()*cols.length)],wc,k:R(),s:Math.floor(R()*1e6),d:farB});x+=w-1+Math.floor(R()*3)}return a}
function farB(X,it){const b=it.base,top=b-it.h,w=it.w,lv=LV();r(X,top,w,it.h,it.c);
  if(it.k<.16){r(X+(w>>1),top-7,1,7,it.c);if(lv>0&&Math.floor(S.t*1.2+it.s)%2)e(X+(w>>1),top-8,1,1,'#ff4a4a')}
  else if(it.k<.3)r(X+2,top-4,w-4,4,it.c);
  else if(it.k<.42&&w>10){r(X+3,top-5,4,5,'#4b3b30');r(X+3,top-6,4,1,'#3a2c24');r(X+4,top-7,2,1,'#3a2c24')}
  if(lv>0){for(let y=top+3;y<b-1;y+=3)for(let x=2;x<w-1;x+=3){const hh=hash(it.s+x*7+y*131);if(hh<lv*.36)e(X+x,y,1,1,hh<.05?'#bfe3ff':'#ffd27a',.85)}}
  else for(let x=2;x<w-1;x+=3)r(X+x,top+3,1,it.h-5,it.wc)}
function esb(X,it){const b=it.base,c=it.c||'#7d889e',l='#97a2b6',cx=X+12,lv=LV();
  r(cx-12,b-62,24,62,c);r(cx-9,b-76,18,14,c);r(cx-6,b-84,12,8,c);r(cx-4,b-90,8,6,c);r(cx-2,b-97,4,7,c);r(cx-1,b-108,2,11,c);r(cx,b-118,1,10,c);
  for(let x=-10;x<11;x+=3)r(cx+x,b-60,1,58,l);for(let x=-7;x<8;x+=3)r(cx+x,b-74,1,12,l);
  if(lv>0){for(let y=b-60;y<b-2;y+=3)for(let x=-10;x<11;x+=2){if(hash(x*17+y*7+99)<lv*.4)e(cx+x,y,1,1,'#ffd27a',.8)}
    e(cx-6,b-84,12,2,'#b06bff',.95);e(cx-4,b-90,8,6,'#c98bff',.95);e(cx-2,b-97,4,7,'#ead2ff',.95);e(cx-1,b-108,2,11,'#ffffff',.8);glow(cx,b-92,16,'#c98bff',.5*lv)}}
function chrysler(X,it){const b=it.base,c='#828b9d',cr='#cfd3db',cx=X+7,lv=LV();r(cx-7,b-56,14,56,c);for(let x=-5;x<6;x+=3)r(cx+x,b-54,1,52,'#9aa2b2');
  for(let i=0;i<5;i++){const w=12-i*2,y=b-56-(i+1)*5;r(cx-w/2,y,w,5,cr);for(let x=0;x<w-1;x+=2){lv>0?e(cx-w/2+x+1,y+2,1,2,'#fff1c4',.95):r(cx-w/2+x+1,y+2,1,2,'#6b7383')}}
  r(cx-1,b-84,2,3,cr);r(cx,b-96,1,12,cr);if(lv>0)glow(cx,b-70,12,'#fff1c4',.4*lv)}
function owtc(X,it){const b=it.base,h=it.h||112,cx=X+11,lv=LV();for(let y=0;y<h;y++){const w=Math.round(22-12*(y/h));r(cx-w/2,b-y-1,w,1,(y>>1)%2?'#7896ba':'#83a2c4')}
  r(cx,b-h,1,h,'#b2cbe3');r(cx-2,b-h-4,4,4,'#9aa6b6');r(cx,b-h-24,1,20,'#d0d4dc');
  if(lv>0){for(let y=4;y<h-2;y+=3){const w=Math.round(22-12*(y/h));for(let x=Math.ceil(-w/2+1);x<w/2-1;x+=2)if(hash(x*13+y*29+7)<lv*.32)e(cx+x,b-y,1,1,'#dbeeff',.8)}e(cx,b-h-25,1,1,'#ffffff',(S.t*2|0)%2?1:.3)}}
function park432(X,it){const b=it.base,h=it.h,lv=LV();r(X,b-h,9,h,'#dedad2');for(let y=b-h+2;y<b-2;y+=3)for(let x=1;x<8;x+=3){lv>0&&hash(x+y*9)<lv*.4?e(X+x,y,2,2,'#ffe2a0',.9):r(X+x,y,2,2,'#59606c')}}
function cpTower(X,it){const b=it.base,h=it.h,lv=LV();r(X,b-h,14,h,'#8ea6ba');r(X+10,b-h,4,h,'#7a92a6');for(let y=b-h+2;y<b;y+=4)r(X,y,14,1,'#a9bfd0');r(X-3,b-h*.3,3,h*.3,'#8ea6ba');r(X+2,b-h-6,10,6,'#6f8496');if(lv>0)for(let y=b-h+3;y<b;y+=4)for(let x=1;x<13;x+=2)if(hash(x*5+y*3+1)<lv*.3)e(X+x,y,1,1,'#ffe2a0',.85)}
function w57(X,it){const b=it.base,h=it.h;for(let y=0;y<h;y++){const w=y>h*.55?Math.max(2,7-Math.floor((y-h*.55)/(h*.45)*6)):7;r(X,b-y-1,w,1,(y>>1)%2?'#c3a383':'#a98a6c')}r(X,b-h-4,1,4,'#a98a6c')}
function one57(X,it){const b=it.base,h=it.h;for(let i=0;i<14;i++){const hh=h-Math.abs(i-4)*2;r(X+i,b-hh,1,hh,i%3?'#3d5f86':'#7fa2c8')}}
function waterTower(x,y){r(x+1,y-5,1,5,'#3a2a20');r(x+8,y-5,1,5,'#3a2a20');r(x+4,y-5,1,5,'#3a2a20');r(x,y-15,10,10,'#7a5a3e');r(x,y-12,10,1,'#4a3424');r(x,y-8,10,1,'#4a3424');r(x+1,y-17,8,2,'#4a3a30');r(x+3,y-19,4,2,'#4a3a30');r(x+4,y-20,2,1,'#4a3a30');if(S.weather==='snow')r(x+1,y-18,8,1,'#f2f6fa')}

function vehPick(R,mix){const keys=Object.keys(mix);let tot=0;for(const k of keys)tot+=mix[k];let u=R()*tot;for(const k of keys){u-=mix[k];if(u<=0)return k}return keys[0]}

function initTraffic(sc){lanes=[];if(!sc.traffic)return;for(const[y,dir]of[[FAR_LANE,-1],[NEAR_LANE,1]]){const lane={y,dir,cars:[]};let x=S.cam-200;while(x<S.cam+W+200){const v=newVeh(vrand,sc,dir,y,x);lane.cars.push(v);x+=VW_[v.t]+sc.gap[0]+vrand()*(sc.gap[1]-sc.gap[0])}lanes.push(lane)}}
function updTraffic(sc,dt){for(const lane of lanes){const d=lane.dir;lane.cars.sort((a,b)=>d>0?b.x-a.x:a.x-b.x);
    for(let i=0;i<lane.cars.length;i++){const v=lane.cars[i];v.x+=v.v*d*dt;if(i>0){const ld=lane.cars[i-1];if(d>0){const mx=ld.x-VW_[v.t]-6;if(v.x>mx)v.x=mx}else{const mn=ld.x+VW_[ld.t]+6;if(v.x<mn)v.x=mn}}}
    lane.cars=lane.cars.filter(v=>v.x>S.cam-320&&v.x<S.cam+W+320);
    const up=lane.cars[lane.cars.length-1];
    if(d>0){const edge=S.cam-120;if(!up||up.x>edge+sc.gap[0]+vrand()*sc.gap[1]){const v=newVeh(vrand,sc,d,lane.y,0);v.x=Math.min(edge,(up?up.x:edge+1e3)-VW_[v.t]-sc.gap[0]);lane.cars.push(v)}}
    else{const edge=S.cam+W+120;if(!up||up.x+VW_[up.t]<edge-sc.gap[0]-vrand()*sc.gap[1]){const v=newVeh(vrand,sc,d,lane.y,0);v.x=Math.max(edge,(up?up.x+VW_[up.t]:edge-1e3)+sc.gap[0]);lane.cars.push(v)}}}}

/* ---------- scene switching & UI ---------- */
const $=id=>document.getElementById(id);
function bulletsHTML(lines){return lines.map(([l,c])=>`<span class="b${c==='#FCCC0A'?' dk':''}" style="background:${c}">${l}</span>`).join('')}
function go(i,cam){if(S.trans)return;S.trans={t:0,to:mod(i,SCENES.length),cam:cam??30,done:false}}
let arriveTimer=0;
function setScene(i,cam){S.scene=i;S.cam=cam;const sc=SCN();if(!S.timeLocked)S.time=sc.defTime;initTraffic(sc);initLife(sc);syncUI();
  const m=META[i];$('arrB').innerHTML=bulletsHTML(m.lines);$('arrN').textContent=m.name;$('arrive').classList.add('on');clearTimeout(arriveTimer);arriveTimer=setTimeout(()=>$('arrive').classList.remove('on'),1500)}
function syncUI(){const m=META[S.scene];$('signB').innerHTML=bulletsHTML(m.lines);$('signN').textContent=m.name;$('signS').textContent=m.sub;
  document.querySelectorAll('.stop').forEach((b,i)=>b.setAttribute('aria-pressed',i===S.scene));
  $('btnTime').textContent={day:'Day',sunset:'Sunset',night:'Night'}[S.time];$('btnW').textContent={clear:'Clear',rain:'Rain',snow:'Snow'}[S.weather];$('btnStroll').setAttribute('aria-pressed',S.stroll)}
$('stops').innerHTML=META.map((m,i)=>`<button class="stop" data-i="${i}" aria-pressed="false"><span class="b${m.lines[0][1]==='#FCCC0A'?' dk':''}" style="background:${m.lines[0][1]}">${m.lines[0][0]}</span>${m.short}</button>`).join('');
$('stops').addEventListener('click',ev=>{const b=ev.target.closest('.stop');if(b&&+b.dataset.i!==S.scene)go(+b.dataset.i,30)});
const TIMES=['day','sunset','night'],WEATHERS=['clear','rain','snow'];
function setTime(v){S.time=v;S.timeLocked=true;syncUI()}function setWeather(v){S.weather=v;syncUI()}
$('btnTime').addEventListener('click',()=>setTime(TIMES[(TIMES.indexOf(S.time)+1)%3]));
$('btnW').addEventListener('click',()=>setWeather(WEATHERS[(WEATHERS.indexOf(S.weather)+1)%3]));
$('btnStroll').addEventListener('click',()=>{S.stroll=!S.stroll;syncUI()});
const bgm=$('bgm');bgm.volume=.45;$('btnMusic').addEventListener('click',()=>{if(bgm.paused){bgm.play().then(()=>$('btnMusic').setAttribute('aria-pressed','true')).catch(()=>{})}else{bgm.pause();$('btnMusic').setAttribute('aria-pressed','false')}});
addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){S.l=true;ev.preventDefault()}else if(k==='arrowright'||k==='d'){S.r=true;ev.preventDefault()}
  else if(k===' '){S.stroll=!S.stroll;syncUI();ev.preventDefault()}else if(k==='t')setTime(TIMES[(TIMES.indexOf(S.time)+1)%3]);else if(k==='r')setWeather(WEATHERS[(WEATHERS.indexOf(S.weather)+1)%3]);
  else if(k>='1'&&k<='6'&&+k-1!==S.scene)go(+k-1,30)});
addEventListener('keyup',ev=>{const k=ev.key.toLowerCase();if(k==='arrowleft'||k==='a')S.l=false;if(k==='arrowright'||k==='d')S.r=false});
addEventListener('blur',()=>{S.l=S.r=false});
const stage=$('stage');stage.addEventListener('pointerdown',ev=>{if(ev.target.closest('button'))return;const rc=stage.getBoundingClientRect();if(ev.clientX-rc.left<rc.width/2)S.l=true;else S.r=true;try{stage.setPointerCapture(ev.pointerId)}catch(_){}});
const up=()=>{S.l=S.r=false};stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);

const KEYS=SCENES.map(s=>s.key);{const hp=location.hash.slice(1).split('.');const hi=KEYS.indexOf(hp[0]);if(hp[1]&&TIMES.includes(hp[1])){S.time=hp[1];S.timeLocked=true}if(hp[2]&&WEATHERS.includes(hp[2]))S.weather=hp[2];setScene(hi<0?0:hi,30)}$('arrive').classList.remove('on');
requestAnimationFrame(frame);
})();
</script>

</body></html>
